name: Build YAAP 16 Kernel (sixteen-suki)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Kernel branch to build'
        required: true
        default: 'sixteen-suki'
        type: choice
        options:
          - 'sixteen-suki'
          - 'sixteen-ksu'

jobs:
  build:
    name: Build Kernel for OnePlus 7 Pro
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || 'sixteen-suki' }}
          fetch-depth: 1

      - name: Install System Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi python3 zip \
            device-tree-compiler git curl cpio

      - name: Setup Android Clang (r547379)
        run: |
          mkdir -p $HOME/android-clang/clang-r547379
          sudo mkdir -p /root/android-clang/clang-r547379
          curl -sL "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r547379.tar.gz" -o clang.tar.gz
          tar -xzf clang.tar.gz -C $HOME/android-clang/clang-r547379
          sudo cp -r $HOME/android-clang/clang-r547379/* /root/android-clang/clang-r547379/
          rm -f clang.tar.gz
          echo "Clang version:"
          $HOME/android-clang/clang-r547379/bin/clang --version

      - name: Compile Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$HOME/android-clang/clang-r547379/bin:$PATH"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export KBUILD_BUILD_USER="salahAldin0"
          export KBUILD_BUILD_HOST="GitHub-Actions"

          make ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip neptune_defconfig
          make ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip -j$(nproc --all) Image.gz-dtb

      - name: Package AnyKernel3 Flashable Zip
        run: |
          mkdir -p artifacts
          git clone https://github.com/osm0sis/AnyKernel3.git anykernel
          sed -i 's/BLOCK=/BLOCK=\/dev\/block\/bootdevice\/by-name\/boot/' anykernel/anykernel.sh
          sed -i 's/IS_SLOT_DEVICE=0/IS_SLOT_DEVICE=1/' anykernel/anykernel.sh
          sed -i 's/device.name1=/device.name1=guacamole/' anykernel/anykernel.sh
          sed -i 's/device.name2=/device.name2=OnePlus7Pro/' anykernel/anykernel.sh
          sed -i 's/device.name3=/device.name3=GM1917/' anykernel/anykernel.sh
          cp arch/arm64/boot/Image.gz-dtb anykernel/
          cd anykernel
          zip -r ../artifacts/AnyKernel3-YAAP16-guacamole-${{ github.event.inputs.branch || 'sixteen-suki' }}.zip * -x .git*
          cd ..
          cp arch/arm64/boot/Image.gz-dtb artifacts/

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: YAAP16-Kernel-Guacamole-${{ github.event.inputs.branch || 'sixteen-suki' }}
          path: artifacts/*